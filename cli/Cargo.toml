[package]
name = "euv-cli"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """Cross-platform CLI tool for the euv native UI framework supporting run, build, check, fmt, doctor, and new across Web, Android, iOS, iPadOS, macOS, Windows, and Linux."""
keywords = ["cli", "cross-platform", "gui", "native", "ui"]
categories = ["command-line-utilities", "development-tools", "gui"]
exclude.workspace = true
autotests = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "euv"
path = "src/main.rs"

[dependencies]
euv-core = { workspace = true }
euv-docs = { workspace = true }

clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lombok-macros = { workspace = true }
