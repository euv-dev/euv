[package]
name = "euv-cli"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """The official CLI tool for the euv UI framework, providing dev/release profiles with run/build modes, hot reload, and wasm-pack integration."""
keywords = ["cross-platform"]
categories = ["network-programming", "web-programming"]
exclude.workspace = true

[[bin]]
name = "euv"
path = "src/main.rs"

[dependencies]
log = { workspace = true }
syn = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
qrcode = { workspace = true }
if-addrs = { workspace = true }
hyperlane = { workspace = true }
serde_json = { workspace = true }
proc-macro2 = { workspace = true }
color-output = { workspace = true }
hyperlane-cli = { workspace = true }
lombok-macros = { workspace = true }
