[package]
name = "euv-chart-bench"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """The benchmark harness that compares euv-chart against Apache ECharts."""
keywords = ["chart", "benchmark", "echarts", "wasm"]
categories = ["web-programming", "visualization"]
exclude.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
euv-chart = { workspace = true }

js-sys = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
lombok-macros = { workspace = true }
wasm-bindgen-futures = { workspace = true }
