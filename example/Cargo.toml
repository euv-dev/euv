[package]
name = "euv-example"
version = "0.24.7"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
description = """An example application demonstrating the euv UI framework with reactive signals, custom components, and WebAssembly."""
keywords = ["cross-platform"]
repository = "https://github.com/euv-dev/euv.git"
categories = ["network-programming", "web-programming"]
publish = false
exclude = [
  "target",
  "Cargo.lock",
  "sh",
  ".github",
  "logs",
  "img",
  "**/*.log",
  "www",
]

[dependencies]
euv = { workspace = true }
euv-engine = { workspace = true }
euv-ui = { workspace = true }

compare_version = { workspace = true }
console_error_panic_hook = { workspace = true }
lombok-macros = { workspace = true }
qrcode = { workspace = true, features = ["svg"] }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
[build-dependencies]
chrono = { workspace = true }
toml = { workspace = true }
[dev-dependencies]
euv-macros = { workspace = true }
[lib]
crate-type = ["cdylib"]
