[package]
name = "euv-example"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """An example application demonstrating the euv UI framework with reactive signals, custom components, and WebAssembly."""
keywords = ["cross-platform"]
categories = ["network-programming", "web-programming"]
exclude.workspace = true
autotests = false

[dependencies]
euv = { workspace = true }
euv-ui = { workspace = true }
euv-engine = { workspace = true }

serde = { workspace = true }
qrcode = { workspace = true }
serde_json = { workspace = true }
lombok-macros = { workspace = true }
compare_version = { workspace = true }
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }

[features]
default = []
theme-shadcn = ["euv-ui/theme-shadcn"]
theme-monochrome = ["euv-ui/theme-monochrome"]
theme-antdesign = ["euv-ui/theme-antdesign"]
theme-material = ["euv-ui/theme-material"]
theme-bootstrap = ["euv-ui/theme-bootstrap"]
theme-cupertino = ["euv-ui/theme-cupertino"]
theme-fluent = ["euv-ui/theme-fluent"]
theme-radix = ["euv-ui/theme-radix"]
theme-mantine = ["euv-ui/theme-mantine"]
theme-daisyui = ["euv-ui/theme-daisyui"]
theme-heroui = ["euv-ui/theme-heroui"]
theme-park = ["euv-ui/theme-park"]
theme-geist = ["euv-ui/theme-geist"]

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
euv-macros = { workspace = true }

[lib]
crate-type = ["cdylib"]
