[package]
name = "euv-core"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """Core cross-platform runtime for euv featuring arena-based fine-grained reactivity, deterministic layout, flat scene graph, multi-mode rendering, and direct OS platform adapters."""
keywords = ["cross-platform", "gui", "native", "reactive", "renderer"]
categories = ["gui", "rendering", "wasm"]
exclude.workspace = true
autotests = false

[lib]
crate-type = ["rlib"]

[dependencies]
lombok-macros = { workspace = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
js-sys = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
