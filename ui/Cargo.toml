[package]
name = "euv-ui"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """Cross-platform UI component library and 17-scheme design system for the euv framework with pixel-consistent rendering across Web, Android, iOS, iPadOS, macOS, Windows, and Linux."""
keywords = ["components", "cross-platform", "design-system", "gui", "ui"]
categories = ["gui", "rendering", "wasm"]
exclude.workspace = true
autotests = false

[lib]
crate-type = ["rlib"]

[features]
default = []
theme-park = []
theme-geist = []
theme-radix = []
theme-fluent = []
theme-heroui = []
theme-linear = []
theme-notion = []
theme-shadcn = []
theme-stripe = []
theme-daisyui = []
theme-mantine = []
theme-material = []
theme-supabase = []
theme-antdesign = []
theme-bootstrap = []
theme-cupertino = []
theme-monochrome = []

[dependencies]
euv = { workspace = true }

lombok-macros = { workspace = true }
