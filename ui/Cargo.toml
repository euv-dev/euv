[package]
name = "euv-ui"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """Reusable UI component library for the euv framework, providing buttons, cards, modals, inputs, and more."""
keywords = ["cross-platform", "ui", "components"]
categories = ["web-programming", "gui"]
exclude.workspace = true
autotests = false

[lib]
crate-type = ["rlib"]

[features]
default = []
theme-park = []
theme-geist = []
theme-radix = []
theme-custom = []
theme-fluent = []
theme-heroui = []
theme-linear = []
theme-notion = []
theme-shadcn = []
theme-stripe = []
theme-daisyui = []
theme-mantine = []
theme-material = []
theme-supabase = []
theme-antdesign = []
theme-bootstrap = []
theme-cupertino = []
theme-monochrome = []

[dependencies]
euv = { workspace = true }

js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
lombok-macros = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["FocusOptions"] }

[dev-dependencies]
syn = { workspace = true }
proc-macro2 = { workspace = true }
wasm-bindgen-test = { workspace = true }
