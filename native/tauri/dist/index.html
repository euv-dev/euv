<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Euv</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        function getSchemeUrl(path) {
          var ua = navigator.userAgent || navigator.platform || '';
          return /Win|Android/.test(ua)
            ? 'https://euv.localhost/' + path
            : 'euv://localhost/' + path;
        }
        var stopped = false;
        var pending = false;
        var timer = null;
        var bridgeDelay = 16;
        var retryDelay = 250;
        function schedule(delay) {
          if (stopped) return;
          timer = setTimeout(function () {
            timer = null;
            waitForCache();
          }, delay);
        }
        function retry() {
          pending = false;
          schedule(retryDelay);
          retryDelay = Math.min(retryDelay * 2, 5000);
        }
        function waitForCache() {
          if (stopped || pending) return;
          var internals = window.__TAURI_INTERNALS__;
          if (!internals || typeof internals.invoke !== 'function') {
            schedule(bridgeDelay);
            bridgeDelay = Math.min(bridgeDelay * 2, 250);
            return;
          }
          pending = true;
          try {
            internals.invoke('wait_for_cached_resource').then(function (result) {
              pending = false;
              if (stopped) return;
              if (!result || !result.from_cache) {
                retry();
                return;
              }
              stopped = true;
              window.location.replace(getSchemeUrl('index.html'));
            }, retry);
          } catch (error) {
            retry();
          }
        }
        window.addEventListener('pagehide', function () {
          stopped = true;
          if (timer !== null) clearTimeout(timer);
        });
        waitForCache();
      })();
    </script>
  </body>
</html>
