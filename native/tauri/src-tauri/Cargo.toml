[workspace]

[package]
name = "euv-app"
version = "0.1.2"
description = "euv-app"
edition = "2024"

[lib]
name = "euv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2.63"
serde_json = "1.0.150"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
http = "1.4.1"
log = "0.4.33"
sha2 = "=0.10.9"
scraper = "0.27.0"
swc_common = "26.0.0"
serde_json = "1.0.150"
swc_ecma_ast = "29.0.2"
lombok-macros = "2.0.31"
tauri-plugin-opener = "2"
percent-encoding = "2.3.2"
swc_ecma_parser = "45.1.4"
tauri-plugin-log = "2.8.0"
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "=0.12.28", features = [
    "gzip",
    "rustls-tls-webpki-roots",
], default-features = false }
tokio = { version = "1.52.3", features = [
    "fs",
    "rt",
    "net",
    "sync",
    "time",
    "io-util",
], default-features = false }

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "symbols"
