[package]
name = "euv-docs"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """A documentation site generator powered by euv + euv-ui (Rust/WASM)."""
keywords = ["docs", "static-site", "wasm", "euv"]
categories = ["web-programming"]
exclude.workspace = true
autotests = false

[dependencies]
euv = { workspace = true }
euv-ui = { workspace = true }

lombok-macros = { workspace = true }

[build-dependencies]
serde_yaml = { workspace = true }
http-constant = { workspace = true }
pulldown-cmark = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "euv-docs"
path = "src/bin/docs/main.rs"
required-features = []
