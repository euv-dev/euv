[package]
name = "euv-docs"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """Cross-platform documentation viewer and static site generator powered by euv and euv-ui."""
keywords = ["cross-platform", "docs", "gui", "markdown", "ui"]
categories = ["gui", "text-processing", "wasm"]
exclude.workspace = true
autotests = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "euv-docs"
path = "src/main.rs"

[features]
default = []
theme-park = ["euv-ui/theme-park"]
theme-geist = ["euv-ui/theme-geist"]
theme-radix = ["euv-ui/theme-radix"]
theme-fluent = ["euv-ui/theme-fluent"]
theme-heroui = ["euv-ui/theme-heroui"]
theme-linear = ["euv-ui/theme-linear"]
theme-notion = ["euv-ui/theme-notion"]
theme-shadcn = ["euv-ui/theme-shadcn"]
theme-stripe = ["euv-ui/theme-stripe"]
theme-daisyui = ["euv-ui/theme-daisyui"]
theme-mantine = ["euv-ui/theme-mantine"]
theme-material = ["euv-ui/theme-material"]
theme-supabase = ["euv-ui/theme-supabase"]
theme-antdesign = ["euv-ui/theme-antdesign"]
theme-bootstrap = ["euv-ui/theme-bootstrap"]
theme-cupertino = ["euv-ui/theme-cupertino"]
theme-monochrome = ["euv-ui/theme-monochrome"]

[dependencies]
euv = { workspace = true }
euv-ui = { workspace = true }

serde = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
lombok-macros = { workspace = true }
pulldown-cmark = { workspace = true }
