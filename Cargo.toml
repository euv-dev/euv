[dependencies]
euv-core = { workspace = true }
euv-macros = { workspace = true }

js-sys = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
lombok-macros = { workspace = true }
alloc-no-stdlib = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }

[patch.crates-io]
euv = { path = "." }
euv-ui = { path = "ui" }
euv-cli = { path = "cli" }
euv-core = { path = "core" }
euv-engine = { path = "engine" }
euv-macros = { path = "macros" }
euv-example = { path = "example" }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = [
    "-Oz",
    "--enable-mutable-globals",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-mutable-globals",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.dev.package.euv-example]
opt-level = "z"

[profile.release.package.euv-example]
opt-level = "z"
