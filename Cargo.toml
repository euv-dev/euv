[package]
name = "euv"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """A high-performance cross-platform native UI framework for Rust targeting Web, Android, iOS, iPadOS, macOS, Windows, and Linux with direct system APIs, fine-grained reactivity, and multi-mode rendering."""
keywords = ["cross-platform", "gui", "native", "reactive", "ui"]
categories = ["gui", "rendering", "wasm"]
exclude.workspace = true

[workspace.package]
version = "0.43.0"
readme = "README.md"
edition = "2024"
authors = ["root@devhub.vip"]
license = "MIT"
repository = "https://github.com/euv-dev/euv.git"
exclude = [
    "target",
    "performance",
    "Cargo.lock",
    "sh",
    ".github",
    ".codegraph",
    "logs",
    "img",
    "**/*.log",
    "**/results",
    "**/RESULTS.md",
    "**/.DS_Store",
    "www",
    "dist",
]

[workspace]
members = [
    "core",
    "macros",
    "ui",
    "automation",
    "docs",
    "cli",
    "example",
    "performance",
]
resolver = "3"

[lib]
crate-type = ["rlib"]

[workspace.dependencies]
euv = { path = ".", version = "0.43.0" }
euv-ui = { path = "ui", version = "0.43.0" }
euv-core = { path = "core", version = "0.43.0" }
euv-docs = { path = "docs", version = "0.43.0" }
euv-macros = { path = "macros", version = "0.43.0" }
euv-automation = { path = "automation", version = "0.43.0" }

quote = "1.0.47"
chrono = "0.4.45"
js-sys = "0.3.107"
crate-cli = "10.8.0"
serde_yaml = "0.9.33"
serde_json = "1.0.154"
lombok-macros = "10.8.0"
wasm-bindgen = "0.2.130"
pulldown-cmark = "0.13.6"
wasm-bindgen-futures = "0.4.80"
console_error_panic_hook = "0.1.7"
tokio = { version = "1.53.3", features = ["rt"] }
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.10", features = ["full", "visit", "extra-traits"] }
web-sys = { version = "0.3.107", features = [
    "Gpu",
    "Event",
    "Window",
    "DomRect",
    "Element",
    "History",
    "Storage",
    "UiEvent",
    "console",
    "Document",
    "Location",
    "Clipboard",
    "GpuDevice",
    "ImageData",
    "Navigator",
    "GpuAdapter",
    "MouseEvent",
    "WheelEvent",
    "EventTarget",
    "HtmlElement",
    "Performance",
    "TextMetrics",
    "WebGlBuffer",
    "WebGlShader",
    "PointerEvent",
    "WebGlProgram",
    "KeyboardEvent",
    "MediaQueryList",
    "GpuCanvasContext",
    "HtmlCanvasElement",
    "WebGlUniformLocation",
    "WebGl2RenderingContext",
    "WebGlVertexArrayObject",
    "CanvasRenderingContext2d",
] }

[dependencies]
euv-core = { workspace = true }
euv-macros = { workspace = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
js-sys = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }

[patch.crates-io]
euv = { path = "." }
euv-ui = { path = "ui" }
euv-cli = { path = "cli" }
euv-core = { path = "core" }
euv-docs = { path = "docs" }
euv-macros = { path = "macros" }
euv-example = { path = "example" }
euv-automation = { path = "automation" }

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
debug-assertions = true
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
debug-assertions = false
codegen-units = 1
strip = "debuginfo"
