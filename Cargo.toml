[package]
name = "euv"
version = "0.18.17"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
description = """A declarative, cross-platform UI framework for Rust with virtual DOM, reactive signals, and HTML macros for WebAssembly."""
keywords = ["cross-platform"]
repository = "https://github.com/euv-dev/euv.git"
categories = ["network-programming", "web-programming"]
exclude = ["target", "Cargo.lock", "sh", ".github", "logs", "img", "**/*.log"]

[lib]
crate-type = ["rlib"]

[workspace]
members = ["cli", "core", "engine", "example", "macros", "ui"]
resolver = "3"

[workspace.dependencies]
euv = { path = ".", version = "0.18.16" }
euv-ui = { path = "ui", version = "0.18.16" }
euv-cli = { path = "cli", version = "0.18.16" }
euv-core = { path = "core", version = "0.18.16" }
euv-engine = { path = "engine", version = "0.18.16" }
euv-macros = { path = "macros", version = "0.18.16" }
euv-example = { path = "example", version = "0.18.16" }

log = "0.4.33"
toml = "0.9.12"
quote = "1.0.47"
chrono = "0.4.45"
ignore = "0.4.31"
js-sys = "0.3.103"
if-addrs = "0.15.0"
hyperlane = "21.3.6"
serde_json = "1.0.151"
proc-macro2 = "1.0.107"
wasm-bindgen = "0.2.126"
color-output = "10.0.10"
hyperlane-cli = "0.1.25"
lombok-macros = "2.0.36"
compare_version = "2.0.14"
alloc-no-stdlib = "=2.0.4"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-test = "0.3.76"
wasm-bindgen-futures = "0.4.76"
console_error_panic_hook = "0.1.7"
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
qrcode = { version = "0.14.1", default-features = false }
syn = { version = "2.0.119", features = ["full", "extra-traits"] }
notify = { version = "8.2.0", default-features = false, features = [
    "macos_fsevent",
] }
