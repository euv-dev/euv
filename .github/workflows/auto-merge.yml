name: Auto Merge

# Merges a pull request once every required check is green on its current
# head commit. The decision is made by scripts/auto_merge.py, which is
# fail-closed: a missing check, a running check, a failed check, an
# untrusted author, a draft, a wrong base branch or an unchanged version
# all keep the pull request open.
#
# The merge is performed with the workflow's own token, and the workflows
# that a merge must run are started explicitly afterwards: a merge pushed
# by GITHUB_TOKEN suppresses the workflows that the merge itself would
# trigger, so the release pipeline would never run without that step.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Locate gh
        # The runner already ships gh. Installing it needs a root-owned
        # directory this job does not have, so the preinstalled binary is
        # used instead.
        run: |
          set -euo pipefail
          command -v gh
          gh --version

      - name: Test the merge gate
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_auto_merge.py'

      - name: Merge the pull requests whose checks are green
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/auto_merge.py \
            --repo "$GH_REPO" \
            --config scripts/auto_merge_config.json

      - name: Report the merged pull requests
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GH_REPO" --state merged \
            --limit 5 --json number,title,mergedAt \
            --jq '.[] | "merged #\(.number) \(.mergedAt) \(.title)"'
