name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      package_name: ${{ steps.read.outputs.package_name }}
      branch_name: ${{ steps.read.outputs.branch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read cargo metadata
        id: read
        run: |
          VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          PACKAGE_NAME=$(grep -E '^name = ' Cargo.toml | head -1 | sed -E 's/^name = "([^"]+)".*/\1/')
          BRANCH_NAME="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ -z "$PACKAGE_NAME" ]; then
            echo "Failed to read package info from Cargo.toml"
            exit 1
          fi
          if [ "$BRANCH_NAME" = "master" ]; then
            TAG="v$VERSION"
          else
            TAG="v$VERSION-$BRANCH_NAME"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

  check:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  tests:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Prepare environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run tests
        run: |
          cargo test -p euv-ui
          cargo test -p euv-ui --no-default-features
          cargo test -p euv-ui --no-default-features --features theme-shadcn
          cargo test --all-features --workspace -- --nocapture
          cargo test --manifest-path performance/Cargo.toml --all-targets --no-default-features

  clippy:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Load clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: |
          cargo clippy -p euv-ui --no-default-features --all-targets -- -D warnings
          cargo clippy --all-features --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path performance/Cargo.toml --all-targets --no-default-features -- -D warnings

  build:
    needs: setup
    if: always() && (github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.setup.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup 7-platform Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android,wasm32-unknown-unknown,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu
      - name: Check all 7 targets with warnings denied
        run: |
          for target in aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android wasm32-unknown-unknown x86_64-pc-windows-msvc x86_64-unknown-linux-gnu; do
            echo "=== TARGET: $target ==="
            RUSTFLAGS="-D warnings" cargo check -p euv-core -p euv -p euv-ui --target "$target"
          done
      - name: Run headless smoke and CLI verification
        run: |
          cargo run -p euv-example -- --headless --software
          cargo run -p euv-docs -- --headless
          cargo run -p euv-cli -- doctor
          cargo run -p euv-cli -- build --target all --plan
          cargo run -p euv-performance

  publish:
    permissions:
      contents: write
    needs: [setup, check, tests, clippy, build]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'master' && needs.setup.outputs.tag != '' && needs.check.result == 'success' && needs.tests.result == 'success' && needs.clippy.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install crate-cli
        run: cargo install crate-cli --locked
      - name: Publish to crates.io
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "published=false" >> $GITHUB_OUTPUT
          echo "${{ secrets.CARGO_REGISTRY_TOKEN }}" | cargo login
          crate publish
          echo "published=true" >> "$GITHUB_OUTPUT"

  release:
    needs: [setup, check, tests, clippy, build, publish]
    permissions:
      contents: write
      packages: write
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'master' && needs.setup.outputs.tag != '' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Build source archive
        id: build_archive
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.version }}"
          REPO_NAME="${{ github.event.repository.name }}"
          git archive --format=tar.gz --prefix="${REPO_NAME}-${VERSION}/" HEAD > "${REPO_NAME}-${VERSION}.tar.gz"
          echo "archive_path=${REPO_NAME}-${VERSION}.tar.gz" >> $GITHUB_OUTPUT
      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.version }}"
          TAG="${{ needs.setup.outputs.tag }}"
          ARCHIVE="${{ steps.build_archive.outputs.archive_path }}"
          PACKAGES=(
            "euv-core"
            "euv-macros"
            "euv"
            "euv-ui"
            "euv-cli"
            "euv-docs"
            "euv-example"
            "euv-performance"
          )
          NOTES_FILE="$(mktemp)"
          {
            printf '## Release %s\n\n' "$TAG"
            printf '| Package | crates.io | docs.rs |\n'
            printf '| --- | --- | --- |\n'
            for pkg in "${PACKAGES[@]}"; do
              printf '| `%s` | [crates.io](https://crates.io/crates/%s/%s) | [docs.rs](https://docs.rs/%s/%s) |\n' \
                "$pkg" "$pkg" "$VERSION" "$pkg" "$VERSION"
            done
          } > "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --latest "$ARCHIVE"
          fi
          rm -f "$NOTES_FILE"
