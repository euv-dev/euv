name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EUV_WEB_DIST: ${{ github.workspace }}/example/www
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/tauri/src-tauri/target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/tauri/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108' 'platform-tools'

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/.wasm-pack
            target
            native/tauri/src-tauri/target
          key: apk-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'native/tauri/src-tauri/Cargo.lock') }}
          restore-keys: apk-${{ runner.os }}-

      - name: Install client dependencies and run tests
        working-directory: native/tauri
        run: |
          npm ci
          npm test

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build web and signed APK through euv CLI
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo run -p euv-cli -- build --platforms android --release --crate-path ./example

      - name: Verify local pages inside the APK
        working-directory: native/tauri
        run: node scripts/verify-apk.js euv.apk

      - name: Upload APK and local page provenance
        uses: actions/upload-artifact@v4
        with:
          name: euv-android-apk
          path: |
            native/tauri/euv.apk
            native/tauri/src-tauri/bundled-cache/__euv_local_bundle__.json
          if-no-files-found: error

      - name: Publish rolling APK release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        working-directory: native/tauri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f latest
          git push -f origin latest
          TITLE="Latest APK (build ${{ github.run_number }})"
          NOTES="Local example pages built from commit ${{ github.sha }}."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create latest --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload latest euv.apk --clobber
