name: Build Android Native

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-native-apk:
    name: Build Release Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Configure Android SDK and NDK toolchain
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          API_LEVEL="35"
          BUILD_TOOLS="35.0.0"
          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "${SDK_ROOT}/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            if [ ! -f "${SDK_ROOT}/platforms/android-${API_LEVEL}/android.jar" ] || [ ! -x "${SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt2" ]; then
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}"
            fi
          fi
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(find "${SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          NDK_LLVM_BIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="${NDK_LLVM_BIN}/aarch64-linux-android${API_LEVEL}-clang"
          if [ ! -x "$LINKER" ]; then
            LINKER="$(find "${NDK_LLVM_BIN}" -maxdepth 1 -name 'aarch64-linux-android*-clang' | sort -V | tail -n 1)"
          fi
          {
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_NDK_HOME=${NDK_DIR}"
            echo "ANDROID_API_LEVEL=${API_LEVEL}"
            echo "ANDROID_BUILD_TOOLS=${BUILD_TOOLS}"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${LINKER}"
            echo "CC_aarch64_linux_android=${LINKER}"
            echo "AR_aarch64_linux_android=${NDK_LLVM_BIN}/llvm-ar"
          } >> "$GITHUB_ENV"
          echo "${NDK_LLVM_BIN}" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

      - name: Verify Android NDK target compilation and build signed Release APK
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo check -p euv-core -p euv -p euv-ui --target aarch64-linux-android
          cargo run -p euv-cli -- build --target android --plan
          bash scripts/build/build-android-apk.sh
          ls -lh dist/android/EuvShowcase.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: euv-android-apk
          path: dist/android/EuvShowcase.apk
          if-no-files-found: error
