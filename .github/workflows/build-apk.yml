name: Build Android Native

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Android Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Verify Android NDK target compilation
        run: |
          RUSTFLAGS="-D warnings" cargo check -p euv-core -p euv -p euv-ui --target aarch64-linux-android
          cargo run -p euv-cli -- build --target android --plan
