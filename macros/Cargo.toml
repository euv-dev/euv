[package]
name = "euv-macros"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """Zero-overhead procedural macros for the cross-platform euv UI framework, providing view!, style!, class!, tokens!, watch!, computed!, component, and euv_main!."""
keywords = ["cross-platform", "macros", "proc-macro", "reactive", "ui"]
categories = ["gui", "development-tools::procedural-macro-helpers"]
exclude.workspace = true
autotests = false

[lib]
proc-macro = true

[[test]]
name = "expansion"
path = "tests/expansion/mod.rs"

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
euv = { path = ".." }
