[package]
name = "euv-macros"
version = "0.24.7"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
description = """Procedural macros for the euv UI framework, providing the macro and attribute for declarative UI composition."""
keywords = ["cross-platform"]
repository = "https://github.com/euv-dev/euv.git"
categories = ["network-programming", "web-programming"]
exclude = ["target", "Cargo.lock", "sh", ".github", "logs", "img", "**/*.log"]

[lib]
proc-macro = true

[dependencies]
lombok-macros = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
toml = { workspace = true }
[dev-dependencies]
euv = { path = "../" }
