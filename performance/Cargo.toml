[package]
name = "euv-performance"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = """Reproducible CPU, layout, rasterization, and allocation benchmarks for the cross-platform euv runtime."""
keywords = ["benchmark", "cross-platform", "performance", "reactive", "renderer"]
categories = ["development-tools::profiling", "gui"]
exclude.workspace = true
publish = true
autotests = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "euv-performance"
path = "src/main.rs"

[features]
allocation-tracking = []
default = ["allocation-tracking"]

[dependencies]
euv = { workspace = true }
euv-ui = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
lombok-macros = { workspace = true }
